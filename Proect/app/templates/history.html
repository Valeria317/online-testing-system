<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История попыток</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Мои результаты</h2>
    <table class="table table-bordered">
        <thead>
            <tr><th>Дата и время</th><th>Баллы</th><th>Совет</th></tr>
        </thead>
        <tbody>
            {% for att in attempts %}
            <tr>
                <td>{{ att.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
                <td>{{ att.score }} / {{ att.total }}</td>
                <td>{{ att.advice }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="/test/" class="btn btn-primary">Пройти тест заново</a>
    <a href="/auth/login" class="btn btn-secondary">Выйти</a>
</div>
</body>
</html>
